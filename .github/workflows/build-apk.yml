
name: Build TV Quick Launch Duo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK Packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Source ZIP
        run: |
          unzip -q TVQuickLaunch_Duo_v1_Source.zip
          test -f TVQuickLaunch_Duo_v1_Source/settings.gradle

      - name: Build Debug APK
        working-directory: TVQuickLaunch_Duo_v1_Source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickLaunchDuo-debug-apk
          path: TVQuickLaunch_Duo_v1_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
