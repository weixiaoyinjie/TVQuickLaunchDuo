
name: Build TV Quick Launch Duo APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Source
        run: |
          unzip -oq TVQuickLaunchDuo_v1.1_SSLFix_Source.zip

      - name: Build Debug APK
        working-directory: TVQuickLaunch_Duo_v1_Source
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TVQuickLaunchDuo-v1.1
          path: TVQuickLaunch_Duo_v1_Source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
